apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: devops-exam

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 438424052758.dkr.ecr.us-east-1.amazonaws.com/devops-exam-backend:v2   #As per ECR repository_id 
          ports:
            - containerPort: 5000
