apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: devops-exam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 438424052758.dkr.ecr.us-east-1.amazonaws.com/devops-exam-frontend:v1 #As per ECR repository_id
          ports:
            - containerPort: 80
